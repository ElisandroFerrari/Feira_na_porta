<!doctype html>
<html lang="pt-BR" class="auth-pending">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#173b2b">
  <meta name="description" content="Atualize seus dados de contato e entrega na Feira na Porta.">
  <title>Meu perfil — Feira na Porta</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <script>try{if(localStorage.getItem('feira-na-porta-theme')==='dark')document.documentElement.dataset.theme='dark'}catch(error){console.error('Não foi possível restaurar o tema:',error)}</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/tailwind-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
  <script type="module">
    import('./js/access.js')
      .then(({ requireRole }) => requireRole('customer'))
      .catch((error) => {
        console.error('Não foi possível carregar a validação de acesso:', error);
        window.alert('Não foi possível validar seu acesso. Tente novamente.');
        window.location.replace('index.html');
      });
  </script>
</head>
<body class="min-h-screen bg-[#fbfaf6] text-[#21352a] antialiased">
  <header class="border-b border-forest-900/10 bg-white">
    <div class="site-header-inner mx-auto flex max-w-4xl items-center justify-between gap-4 px-4 py-4 sm:px-6">
      <a href="client.html" class="flex items-center gap-2.5" aria-label="Voltar ao catálogo">
        <span class="grid h-10 w-10 place-items-center rounded-2xl bg-forest-900 text-xl text-harvest-300">✳</span>
        <span><span class="block font-display text-xl leading-none text-forest-900">Feira na Porta</span><span class="mt-1 block text-[10px] font-semibold uppercase tracking-[.18em] text-forest-600">Meu perfil</span></span>
      </a>
      <div class="site-header-actions flex items-center gap-2">
        <a href="client.html" class="rounded-full border border-forest-900/15 px-4 py-2 text-sm font-semibold hover:bg-forest-50">Ver catálogo</a>
        <button type="button" data-theme-toggle class="grid h-10 w-10 place-items-center rounded-full border border-forest-900/15 text-lg hover:bg-forest-50" aria-label="Ativar tema escuro" title="Ativar tema escuro">🌙</button>
        <button id="logout-button" type="button" class="rounded-full bg-forest-900 px-4 py-2 text-sm font-semibold text-white hover:bg-forest-700">Sair</button>
      </div>
    </div>
  </header>
  <main class="mx-auto max-w-4xl space-y-6 px-3 py-6 sm:px-6 sm:py-10">
    <div>
      <p class="text-xs font-extrabold uppercase tracking-[.2em] text-forest-600">Seus dados</p>
      <h1 class="mt-2 font-display text-[clamp(2rem,7vw,2.5rem)] text-forest-900">Meu perfil</h1>
      <p class="mt-3 text-sm leading-6 text-forest-900/60">Mantenha seus dados atualizados para agilizar os próximos pedidos.</p>
    </div>
    <section class="rounded-3xl border border-forest-900/[.07] bg-white p-5 shadow-card sm:p-7">
      <h2 class="font-display text-2xl text-forest-900">Dados cadastrais e endereço</h2>
      <form id="profile-form" class="mt-5 grid gap-4 sm:grid-cols-2">
        <label class="block text-sm font-semibold text-forest-900 sm:col-span-2">Nome completo
          <input name="full_name" type="text" autocomplete="name" maxlength="100" required class="mt-2 h-11 w-full rounded-xl border border-forest-900/10 px-3 font-normal outline-none focus:border-forest-500">
        </label>
        <label class="block text-sm font-semibold text-forest-900 sm:col-span-2">Telefone / WhatsApp
          <input name="phone" type="tel" autocomplete="tel" maxlength="20" required class="mt-2 h-11 w-full rounded-xl border border-forest-900/10 px-3 font-normal outline-none focus:border-forest-500" placeholder="(00) 00000-0000">
        </label>
        <label class="block text-sm font-semibold text-forest-900 sm:col-span-2">Rua
          <input name="street" type="text" autocomplete="street-address" maxlength="120" required class="mt-2 h-11 w-full rounded-xl border border-forest-900/10 px-3 font-normal outline-none focus:border-forest-500">
        </label>
        <label class="block text-sm font-semibold text-forest-900">Número
          <input name="house_number" type="text" autocomplete="address-line2" maxlength="20" required class="mt-2 h-11 w-full rounded-xl border border-forest-900/10 px-3 font-normal outline-none focus:border-forest-500">
        </label>
        <label class="block text-sm font-semibold text-forest-900">Bairro
          <input name="neighborhood" type="text" autocomplete="address-level3" maxlength="80" required class="mt-2 h-11 w-full rounded-xl border border-forest-900/10 px-3 font-normal outline-none focus:border-forest-500">
        </label>
        <label class="block text-sm font-semibold text-forest-900 sm:col-span-2">Cidade
          <input name="city" type="text" autocomplete="address-level2" maxlength="80" required class="mt-2 h-11 w-full rounded-xl border border-forest-900/10 px-3 font-normal outline-none focus:border-forest-500">
        </label>
        <p id="profile-message" class="hidden rounded-xl p-3 text-sm sm:col-span-2" role="status" aria-live="polite"></p>
        <button type="submit" class="min-h-11 justify-self-start rounded-full bg-forest-900 px-5 font-bold text-white hover:bg-forest-700 disabled:opacity-50">Salvar dados</button>
      </form>
    </section>
    <section class="rounded-3xl border border-forest-900/[.07] bg-white p-5 shadow-card sm:p-7">
      <h2 class="font-display text-2xl text-forest-900">E-mail e senha</h2>
      <p id="current-email" class="mt-2 text-sm text-forest-900/60"></p>
      <form id="security-form" class="mt-5 space-y-4">
        <label class="block text-sm font-semibold text-forest-900">Novo e-mail <span class="font-normal text-forest-900/50">(opcional)</span>
          <input name="email" type="email" autocomplete="email" class="mt-2 h-11 w-full rounded-xl border border-forest-900/10 px-3 font-normal outline-none focus:border-forest-500" placeholder="Deixe em branco para manter">
        </label>
        <label class="block text-sm font-semibold text-forest-900">Nova senha <span class="font-normal text-forest-900/50">(opcional, mínimo 8 caracteres)</span>
          <input name="password" type="password" autocomplete="new-password" minlength="8" class="mt-2 h-11 w-full rounded-xl border border-forest-900/10 px-3 font-normal outline-none focus:border-forest-500" placeholder="Deixe em branco para manter">
        </label>
        <p id="security-message" class="hidden rounded-xl p-3 text-sm" role="status" aria-live="polite"></p>
        <button type="submit" class="min-h-11 rounded-full border border-forest-900/15 px-5 font-semibold hover:bg-forest-50 disabled:opacity-50">Atualizar acesso</button>
      </form>
    </section>
  </main>
  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/profile.js"></script>
</body>
</html>
